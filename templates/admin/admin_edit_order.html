<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Order Status</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 500px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-3">Edit Order #{{ order.OrderID }}</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label for="order_status" class="form-label">Order Status</label>
                        <select name="order_status" id="order_status" class="form-select" required>
                            <option value="Processing" {% if order.OrderStatus == 'Processing' %}selected{% endif %}>Processing</option>
                            <option value="Shipped" {% if order.OrderStatus == 'Shipped' %}selected{% endif %}>Shipped</option>
                            <option value="Delivered" {% if order.OrderStatus == 'Delivered' %}selected{% endif %}>Delivered</option>
                            <option value="Cancelled" {% if order.OrderStatus == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Status</button>
                    <a href="{{ url_for('manager_orders') }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
