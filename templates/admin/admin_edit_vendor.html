<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Vendor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="nav-links">
        <a href="{{ url_for('index') }}">Home / Dashboard</a>
        <a href="{{ url_for('manage_categories') }}">Categories</a>
        <a href="{{ url_for('manage_vendors') }}">Vendors</a>
        <a href="{{ url_for('manage_customers') }}">Customers</a>
        <a href="{{ url_for('manage_products') }}">Products</a>
    </div>

    <h1>Edit Vendor</h1>

    <div class="form-box">
        <form action="{{ url_for('edit_vendor', vendor_id=vendor.VendorID) }}" method="POST">
            <label for="vendor_name">Vendor Name:</label>
            <input type="text" id="vendor_name" name="vendor_name" value="{{ vendor.VendorName }}" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ vendor.Email }}" required>

            <label for="phone_number">Phone Number:</label>
            <input type="tel" id="phone_number" name="phone_number" value="{{ vendor.PhoneNumber }}">

            <label for="vendor_status">Vendor Status:</label>
            <select id="vendor_status" name="vendor_status" required>
                <option value="Active" {% if vendor.VendorStatus == 'Active' %}selected{% endif %}>Active</option>
                <option value="Inactive" {% if vendor.VendorStatus == 'Inactive' %}selected{% endif %}>Inactive</option>
            </select>

            <label for="manager_id">System Manager:</label>
            <select id="manager_id" name="manager_id">
                <option value="">-- None --</option>
                {% for mgr in managers %}
                    <option value="{{ mgr.ManagerID }}" {% if vendor.ManagerID == mgr.ManagerID %}selected{% endif %}>{{ mgr.Name }}</option>
                {% endfor %}
            </select>

            <button type="submit">Update Vendor</button>
        </form>
    </div>
</body>
</html>
