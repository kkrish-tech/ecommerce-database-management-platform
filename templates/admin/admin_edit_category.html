<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Category</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="nav-links">
        <a href="{{ url_for('index') }}">Home / Dashboard</a>
        <a href="{{ url_for('manage_categories') }}">Categories</a>
        <a href="{{ url_for('manage_vendors') }}">Vendors</a>
        <a href="{{ url_for('manage_customers') }}">Customers</a>
        <a href="{{ url_for('manage_products') }}">Products</a>
    </div>

    <h1>Edit Category</h1>

    <div class="form-box">
        <form action="{{ url_for('edit_category', category_id=category.CategoryID) }}" method="POST">
            <label for="category_name">Category Name:</label>
            <input type="text" id="category_name" name="category_name" value="{{ category.CategoryName }}" required>
            <button type="submit">Update Category</button>
        </form>
    </div>
</body>
</html>
