<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="nav-links">
        <a href="{{ url_for('index') }}">Home / Dashboard</a>
        <a href="{{ url_for('manage_categories') }}">Categories</a>
        <a href="{{ url_for('manage_vendors') }}">Vendors</a>
        <a href="{{ url_for('manage_customers') }}">Customers</a>
        <a href="{{ url_for('manage_products') }}">Products</a>
    </div>

    <h1>Edit Product</h1>

    <div class="form-box">
        <form action="{{ url_for('edit_product', product_id=product.ProductID) }}" method="POST">
            <label for="product_name">Product Name:</label>
            <input type="text" id="product_name" name="product_name" value="{{ product.ProductName }}" required>

            <label for="price">Price:</label>
            <input type="number" step="0.01" id="price" name="price" value="{{ product.Price }}" required>

            <label for="stock_quantity">Stock Quantity:</label>
            <input type="number" id="stock_quantity" name="stock_quantity" value="{{ product.StockQuantity }}" required>

            <label for="description">Description:</label>
            <textarea id="description" name="description">{{ product.Description }}</textarea>

            <label for="country_of_origin">Country of Origin:</label>
            <input type="text" id="country_of_origin" name="country_of_origin" value="{{ product.CountryOfOrigin }}">

            <label for="vendor_id">Vendor:</label>
            <select id="vendor_id" name="vendor_id" required>
                {% for v in vendors %}
                    <option value="{{ v.VendorID }}" {% if product.VendorID == v.VendorID %}selected{% endif %}>{{ v.VendorName }}</option>
                {% endfor %}
            </select>

            <button type="submit">Update Product</button>
        </form>
    </div>
</body>
</html>
